name: Bookstatistic Java CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 1. Собираем общую библиотеку
      - name: Build commons-lib
        run: |
          cd commons-lib
          mvn clean install -DskipTests
          cd ..

      # 2. Загрузка OIbox стартер
      - name: Install iobox-starter from libs
        run: |
          mvn install:install-file \
            -Dfile=libs/spring-iobox-starter-1.0.0.jar \
            -DgroupId=org.jedi_bachelor \
            -DartifactId=spring-iobox-starter \
            -Dversion=1.0.0 \
            -Dpackaging=jar

      # 4. Собираем основной проект
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 5. Запускаем тесты
      - name: Test
        run: mvn clean test