apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: bookstatistic
  labels:
    app: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: config-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8071
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: config-secrets
                  key: encrypt-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: bookstatistic
spec:
  selector:
    app: config-server
  ports:
    - port: 8071
      targetPort: 8071
  type: ClusterIP