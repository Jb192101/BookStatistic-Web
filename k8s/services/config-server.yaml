apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: bookstatistic
  labels:
    app: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: config-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8071
          envFrom:
            - configMapRef:
                name: bookstatistic-config
            - secretRef:
                name: bookstatistic-secrets
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "native"
            - name: ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: bookstatistic-secrets
                  key: ENCRYPT_KEY
            - name: ACCOUNT_DB_URL
              valueFrom:
                secretKeyRef:
                  name: bookstatistic-secrets
                  key: ACCOUNT_DB_URL
            - name: ACCOUNT_DB_USER
              valueFrom:
                secretKeyRef:
                  name: bookstatistic-secrets
                  key: ACCOUNT_DB_USER
            - name: ACCOUNT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookstatistic-secrets
                  key: ACCOUNT_DB_PASSWORD
            - name: KEYCLOAK_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: bookstatistic-config
                  key: KEYCLOAK_SERVER_URL
            - name: KEYCLOAK_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: bookstatistic-config
                  key: KEYCLOAK_ISSUER_URI
            - name: KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: bookstatistic-config
                  key: KEYCLOAK_REALM
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: bookstatistic-config
                  key: KEYCLOAK_CLIENT_ID
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bookstatistic-secrets
                  key: KEYCLOAK_CLIENT_SECRET
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: bookstatistic-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,prometheus,metrics"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: bookstatistic
spec:
  selector:
    app: config-server
  ports:
    - port: 8071
      targetPort: 8071
  type: ClusterIP