apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: bookstatistic
  labels:
    app: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: bookstatistic-config
            - secretRef:
                name: bookstatistic-secrets
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: CONFIG_SERVER_PATH
              valueFrom:
                configMapKeyRef:
                  name: bookstatistic-config
                  key: CONFIG_SERVER_PATH
            - name: NOTIFICATION_DB_URL
              valueFrom:
                secretKeyRef:
                  name: bookstatistic-secrets
                  key: NOTIFICATION_DB_URL
            - name: NOTIFICATION_DB_USER
              valueFrom:
                secretKeyRef:
                  name: bookstatistic-secrets
                  key: NOTIFICATION_DB_USER
            - name: NOTIFICATION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookstatistic-secrets
                  key: NOTIFICATION_DB_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: bookstatistic-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: EMAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: bookstatistic-config
                  key: EMAIL_HOST
            - name: EMAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: bookstatistic-config
                  key: EMAIL_PORT
            - name: EMAIL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: bookstatistic-config
                  key: EMAIL_USERNAME
            - name: EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookstatistic-secrets
                  key: EMAIL_PASSWORD
            - name: ACCOUNT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: bookstatistic-config
                  key: ACCOUNT_SERVICE_URL
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,prometheus,metrics"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: bookstatistic
spec:
  selector:
    app: notification-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP
