input {
  tcp {
    port => 5000
    codec => json
    type => "spring-boot"
  }
}

filter {
  mutate {
    add_tag => [ "bookstatistic" ]
  }

  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
    timezone => "UTC"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logs-book-service-%{+YYYY.MM.dd}"
    user => ""
    password => ""
  }

  stdout {
    codec => rubydebug
  }
}