global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'bookstatistic-monitor'

# Правила для алертов
rule_files:
# - "alerts.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Gateway Service
  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway:8083']
        labels:
          application: 'gateway'
          service: 'gateway'

  # Account Service
  - job_name: 'account-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['account-service:8084']
        labels:
          application: 'account-service'
          service: 'account'

  # Book Service
  - job_name: 'book-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['book-service:8081']
        labels:
          application: 'book-service'
          service: 'book'

  # Analyze Service
  - job_name: 'analyze-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['analyze-service:8082']
        labels:
          application: 'analyze-service'
          service: 'analyze'

  # Notification Service
  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['notification-service:8085']
        labels:
          application: 'notification-service'
          service: 'notification'

  # Eureka
  - job_name: 'eureka'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['eureka:8070']
        labels:
          application: 'eureka'
          service: 'eureka'