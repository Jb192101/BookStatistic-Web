version: '3.8'

services:
  notification-postgres:
    image: postgres:16-alpine
    container_name: notification-postgres
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: UTC+3
    ports:
      - ${NOTIFICATION_DB_PORT}:5432
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=256m
    volumes:
      - ./docker/init-notification.sql
    shm_size: "256m"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1 -p 5432" ]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  book-postgres:
    image: postgres:16-alpine
    container_name: book-postgres
    environment:
      POSTGRES_DB: ${BOOK_DB_NAME}
      POSTGRES_USER: ${BOOK_DB_USER}
      POSTGRES_PASSWORD: ${BOOK_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: UTC+3
    ports:
      - ${BOOK_PG_DB_PORT}:5431
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=256m
    volumes:
      - ./docker/init-books.sql
    shm_size: "256m"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1 -p 5432" ]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "${BOOK_MONGO_DB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${BOOK_MONGO_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${BOOK_MONGO_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${BOOK_MONGO_DB_HOSTNAME}
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - bookstatistic-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  book-redis:
    image: redis:7-alpine
    container_name: book-redis
    ports:
      - ${BOOK_DB_REDIS_PORT}:6379
    restart: unless-stopped

  account-postgres:
    image: postgres:16-alpine
    container_name: account-postgres
    environment:
      POSTGRES_DB: ${ACCOUNT_DB_NAME}
      POSTGRES_USER: ${ACCOUNT_DB_USER}
      POSTGRES_PASSWORD: ${ACCOUNT_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: UTC+3
    ports:
      - ${ACCOUNT_DB_PORT}:5432
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=256m
    volumes:
      - ./docker/init-account.sql
    shm_size: "256m"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1 -p 5432" ]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  analyze-postgres:
    image: postgres:16-alpine
    container_name: analyze-postgres
    environment:
      POSTGRES_DB: ${ANALYZE_PG_DB_NAME}
      POSTGRES_USER: ${ANALYZE_PG_DB_USER}
      POSTGRES_PASSWORD: ${ANALYZE_PG_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: UTC+3
    ports:
      - ${ANALYZE_PG_DB_PORT}:5432
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=256m
    volumes:
      - ./docker/init-analyze.sql
    shm_size: "256m"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1 -p 5432" ]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  analyze-redis:
    image: redis:7-alpine
    container_name: analyze-redis
    ports:
      - ${ANALYZE_REDIS_DB_PORT}:6378
    restart: unless-stopped

  book-service:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile-book
    container_name: bookstatistic-book-container
    environment:
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus,metrics
    ports:
      - ${BOOK_SERVER_PORT}:8082
    networks:
      - bookstatistic-network
    restart: unless-stopped

  account-service:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile-account
    container_name: bookstatistic-account-container
    environment:
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus,metrics
    ports:
      - ${ACCOUNT_SERVER_PORT}:8084
    networks:
      - bookstatistic-network
    restart: unless-stopped

  analyze-service:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile-analyze
    container_name: bookstatistic-analyze-container
    environment:
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus,metrics
    ports:
      - ${ANALYZE_SERVER_PORT}:8085
    networks:
      - bookstatistic-network
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile-notification
    container_name: bookstatistic-notification-container
    environment:
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus,metrics
    ports:
      - ${NOTIFICATION_SERVER_PORT}:8081
    networks:
      - bookstatistic-network
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile-gateway
    container_name: bookstatistic-gateway-container
    ports:
      - ${GATEWAY_SERVER_PORT}:8083
    networks:
      - bookstatistic-network
    restart: unless-stopped

  keycloak:
    image: jboss/keycloak
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: true
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KEYCLOAK_VERSION: 6.0.1
      KEYCLOAK_USER: ${KEYCLOAK_USER}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_PASSWORD}
    volumes:
      - ./docker/realm-export.json
    command:
      - "-b 0.0.0.0"
      - "-Dkeycloak.import=/opt/jboss/keycloak/realm-export.json"
      - "-Dkeycloak.profile.feature.scripts=enabled"
      - "-Dkeycloak.profile.feature.upload_scripts=enabled"
    ports:
      - "8090:8090"
    networks:
      backend:
        aliases:
          - "keycloak"

  postgres-keycloak:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
      POSTGRES_HOST_AUTH_METHOD: trust

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - bookstatistic-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - bookstatistic-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8180:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "bs-group"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "zookeeper:2181"
    networks:
      - bookstatistic-network
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - cluster.name=docker-cluster
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata1:/usr/share/elasticsearch/data
    ports:
      - 9300:9300
      - 9200:9200
    networks:
      - bookstatistic-network
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    environment:
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
    ports:
      - 5601:5601
    networks:
      - bookstatistic-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: logstash
    command: logstash -f /etc/logstash/conf.d/logstash.conf
    volumes:
      - ./config:/etc/logstash/conf.d
    ports:
      - "5000:5000"
    networks:
      - bookstatistic-network

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    depends_on:
      - elasticsearch
    environment:
      - STORAGE_TYPE=elasticsearch
      - ES_HOSTS=elasticsearch:9200
    ports:
      - "9411:9411"
    networks:
      - bookstatistic-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - bookstatistic-network
    depends_on:
      - account-service
      - book-service
      - analyze-service
      - notification-service
      - gateway

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/provisioning
      - ./grafana/provisioning:/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    networks:
      - bookstatistic-network
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:

networks:
  bookstatistic-network:
    driver: bridge