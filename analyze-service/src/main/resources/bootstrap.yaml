spring:
  profiles:
    active: prod
  application:
    name: analyze-service
  config:
    import: configserver:http://config-server:8071
  cloud:
    config:
      uri: configserver:http://config-server:8071
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        multiplier: 1.1