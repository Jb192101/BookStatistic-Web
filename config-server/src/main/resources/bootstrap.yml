spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        encrypt:
          enabled: true
        native:
          search-locations: classpath:/config/notification,classpath:/config/analyze,classpath:/config/book,classpath:/config/gateway,classpath:/config/account,classpath:/config/eureka

server:
  port: 8071

encrypt:
  key: ${ENCRYPT_KEY}

management:
  endpoints:
    web:
      exposure:
        include: "*"

eureka:
  instance:
    preferIpAddress: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/