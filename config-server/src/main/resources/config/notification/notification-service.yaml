eureka:
  instance:
    preferIpAddress: true

  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

server:
  port: ${NOTIFICATION_SERVER_PORT:8081}

spring:
  kafka:
    bootstrap-servers: localhost:9092
  zipkin:
    baseUrl: http://zipkin:9411
  sleuth:
    sampler:
      percentage: 1

  application:
    name: notification-service

  datasource:
    url: ${NOTIFICATION_DB_URL}
    username: ${NOTIFICATION_DB_USER}
    password: ${NOTIFICATION_DB_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/bookstatistic-realm

  mail:
    host: ${EMAIL_HOST}
    port: ${EMAIL_PORT}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
        ssl:
          enable: true
    default-encoding: UTF-8

kafka:
  topics:
    sending-notification-topic: "sending_notification_topic"
    sending-notification-result-topic: "sending_notification_result_topic"
  groups:
    bs-group: "bs-kafka-group"

external-urls:
  account:
    base-url: "http://localhost:8084/users"
    emails: "/emails"

management:
  endpoints:
    web:
      base-path: "/"
    enabled-by-default: false
    health:
      enabled: true
      show-details: always
      db:
        enabled: false
      diskspace:
        enabled: true

keycloak:
  realm: bookstatistic-realm
  auth-server-url: http://keycloak:8090/auth
  ssl-required: external
  resource: bookstatistic # идентификатор клиента
  credentials:
    secret: # здесь должен быть secret key из панели keycloak
  bearer-only: true
  use-resource-role-mappings: true