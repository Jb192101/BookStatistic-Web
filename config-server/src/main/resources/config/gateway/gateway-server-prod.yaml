server:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  shutdown: graceful
  port: ${GATEWAY_SERVER_PORT:8083}

management:
  health:
    probes:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

bookstatistic:
  routing:
    analyze: ${ANALYZE_SERVICE_URL:http://analyze-service:8085}
    book: ${BOOK_SERVICE_URL:http://book-service:8082}
    notification: ${NOTIFICATION_SERVICE_URL:http://notification-service:8081}
    gateway: ${GATEWAY_SERVICE_URL:http://gateway:8083}
    keycloak: ${KEYCLOAK_SERVER_URL:http://keycloak:8080}
    account: ${ACCOUNT_SERVICE_URL:http://account-service:8084}

eureka:
  instance:
    preferIpAddress: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:gateway}
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
  client:
    registerWithEureka: ${EUREKA_REGISTER:true}
    fetchRegistry: ${EUREKA_FETCH:true}
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://discovery-server:8070/eureka/}

spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: bookstatistic
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/bookstatistic-realm}
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/bookstatistic-realm}
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

  zipkin:
    baseUrl: ${ZIPKIN_URL:http://zipkin:9411}

  sleuth:
    sampler:
      percentage: ${TRACING_SAMPLER_PROBABILITY:0.1}

  cloud:
    discovery:
      locator:
        enabled: true
        lower-case-service-id: true
    loadbalancer:
      ribbon:
        enabled: false
    gateway:
      routes:
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/v1/notifications/**
          filters:
            - RemoveRequestHeader= Cookie,Set-Cookie
            - name: CircuitBreaker
              args:
                name: notificationCircuitBreaker
                fallbackUri: forward:/fallback/notification

        - id: book-service
          uri: lb://book-service
          predicates:
            - Path=/v1/books/**
          filters:
            - RemoveRequestHeader= Cookie,Set-Cookie
            - name: CircuitBreaker
              args:
                name: bookCircuitBreaker
                fallbackUri: forward:/fallback/book

        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/v1/users/**, /v1/auth/**
          filters:
            - RemoveRequestHeader= Cookie,Set-Cookie
            - name: CircuitBreaker
              args:
                name: accountCircuitBreaker
                fallbackUri: forward:/fallback/account

        - id: analyze-service
          uri: lb://analyze-service
          predicates:
            - Path=/v1/analyze/**
          filters:
            - RemoveRequestHeader= Cookie,Set-Cookie
            - name: CircuitBreaker
              args:
                name: analyzeCircuitBreaker
                fallbackUri: forward:/fallback/analyze

keycloak:
  client-id: bookstatistic
  admin:
    server-url: ${KEYCLOAK_SERVER_URL:http://keycloak:8080}
    realm: bookstatistic-realm
    client-id: bookstatistic
    username: ${KEYCLOAK_ADMIN_USERNAME}
    password: ${KEYCLOAK_ADMIN_PASSWORD}
  realm: bookstatistic-realm
  auth-server-url: ${KEYCLOAK_SERVER_URL:http://keycloak:8080}
  resource: bookstatistic
  credentials:
    secret: ${KEYCLOAK_CLIENT_SECRET}
  bearer-only: true
  use-resource-role-mappings: true
  init:
    enabled: false

resilience4j:
  circuitbreaker:
    instances:
      notificationCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
      bookCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
      accountCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
      analyzeCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3

logging:
  level:
    root: WARN
    org.jedi_bachelor.bookstatistic.gateway: INFO
    org.springframework.cloud.gateway: WARN
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} ${LOG_LEVEL_PATTERN:-%5p} ${PID:- } --- [%15.15t] %-40.40logger{39} : %m%n"
  file:
    name: /var/log/gateway/application.log
    max-size: 100MB
    max-history: 7