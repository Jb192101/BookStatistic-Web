external-urls:
  notification:
    base-url: http://localhost:8081/
    add-new-notification:

server:
  port: ${BOOK_SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

spring:
  application:
    name: book-service

  kafka:
    bootstrap-servers: localhost:9092

  datasource:
    url: ${BOOK_PG_DB_URL}
    username: ${BOOK_PG_DB_USER}
    password: ${BOOK_PG_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  zipkin:
    baseUrl: zipkin:9411

  sleuth:
    sampler:
      percentage: 1

servlet:
  multipart:
    max-file-size: 30MB
    max-request-size: 30MB
    enabled: true

keycloak:
  realm: bookstatistic-realm
  auth-server-url: http://keycloak:8090/auth
  ssl-required: external
  resource: bookstatistic
  credentials:
    secret:
  bearer-only: true
  use-resource-role-mappings: true

kafka:
  topics:
    sending-notification-topic: "sending-notification-topic"
    sending-notification-result-topic: "sending-notification-result-topic"
  groups:
    bs-group: "bs-group"