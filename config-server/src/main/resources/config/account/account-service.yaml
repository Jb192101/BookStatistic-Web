spring:
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/bookstatistic-realm}
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:bookstatistic}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sleuth:
    sampler:
      probability: 1.0

  application:
    name: account-service

  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:postgresql://localhost:5432/account_db}
    username: ${ACCOUNT_DB_USER:postgres}
    password: ${ACCOUNT_DB_PASSWORD:postgres}

external-urls:
  analyze:
    base-url: ${ANALYZE_SERVICE_URL:http://localhost:8081/v1/analyze}
    delete-user-data: /
  notification:
    base-url: http://localhost:8081/v1/notification-setting
    post-notification-settings:

server:
  port: ${ACCOUNT_SERVER_PORT:8084}

eureka:
  instance:
    preferIpAddress: true
    instance-id: ${spring.application.name}:${random.value}
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

zipkin:
  baseUrl: ${ZIPKIN_URL:http://zipkin:9411}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

kafka:
  topics:
    sending-notification-topic: "sending-notification-topic"
    sending-notification-result-topic: "sending-notification-result-topic"
  groups:
    bs-group: "bs-group"

keycloak:
  auth-server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:bookstatistic-realm}
  client-id: ${KEYCLOAK_CLIENT_ID:bookstatistic}
  credentials:
    secret: ${KEYCLOAK_CLIENT_SECRET}