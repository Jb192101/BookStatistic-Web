spring:
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/bookstatistic-realm}
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:bookstatistic}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false

  sleuth:
    sampler:
      probability: ${TRACING_SAMPLER_PROBABILITY:0.1}

  application:
    name: account-service

  datasource:
    url: ${ACCOUNT_DB_URL}
    username: ${ACCOUNT_DB_USER}
    password: ${ACCOUNT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

external-urls:
  analyze:
    base-url: ${ANALYZE_SERVICE_URL:http://analyze-service:8085/v1/analyze}
    delete-user-data: /
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8081/v1/notification-setting}
    post-notification-settings:

server:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  shutdown: graceful
  port: ${ACCOUNT_SERVER_PORT:8084}

eureka:
  instance:
    preferIpAddress: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:account-service}
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
  client:
    registerWithEureka: ${EUREKA_REGISTER:true}
    fetchRegistry: ${EUREKA_FETCH:true}
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://discovery-server:8070/eureka/}
    healthcheck:
      enabled: true

zipkin:
  baseUrl: ${ZIPKIN_URL:http://zipkin:9411}

management:
  health:
    probes:
      enabled: true
    liveness-state:
      enabled: true
    readiness-state:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
    health:
      show-details: when-authorized
      show-components: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  topics:
    sending-notification-topic: "sending-notification-topic"
    sending-notification-result-topic: "sending-notification-result-topic"
  groups:
    bs-group: "bs-group"

keycloak:
  auth-server-url: ${KEYCLOAK_SERVER_URL:http://keycloak:8080}
  realm: ${KEYCLOAK_REALM:bookstatistic-realm}
  client-id: ${KEYCLOAK_CLIENT_ID:bookstatistic}
  credentials:
    secret: ${KEYCLOAK_CLIENT_SECRET}
  init:
    enabled: ${KEYCLOAK_INIT_ENABLED:false}
  smtp:
    host: ${KEYCLOAK_SMTP_HOST}
    port: ${KEYCLOAK_SMTP_PORT:465}
    from: ${KEYCLOAK_SMTP_FROM}
    from-display-name: ${KEYCLOAK_SMTP_FROM_DISPLAY_NAME:BookStatistic Team}
    reply-to: ${KEYCLOAK_SMTP_REPLY_TO}
    username: ${KEYCLOAK_SMTP_USERNAME}
    password: ${KEYCLOAK_SMTP_PASSWORD}
    ssl: ${KEYCLOAK_SMTP_SSL:true}
    starttls: ${KEYCLOAK_SMTP_STARTTLS:false}
    auth: ${KEYCLOAK_SMTP_AUTH:true}

logging:
  level:
    root: WARN
    org.jedi_bachelor.bookstatistic.accountservice: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} ${LOG_LEVEL_PATTERN:-%5p} ${PID:- } --- [%15.15t] %-40.40logger{39} : %m%n"
  file:
    name: /var/log/account-service/application.log
    max-size: 100MB
    max-history: 7